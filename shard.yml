name: crystal_llm
version: 1.16.0

description: |
  One beautiful Crystal API for GPT, Claude, Gemini, and more. A faithful port
  of Carmine Paolino's ruby_llm gem — same public API, tracking its versions.

authors:
  - Stephen Ierodiaconou <stevegeek@gmail.com>

crystal: ">= 1.20.0"

license: MIT

repository: https://github.com/stevegeek/crystal-llm

dependencies:
  crest:
    github: mamantoha/crest
    version: ">= 1.0.0"
  # AWS Signature V4 request signing (Bedrock auth).
  awscr-signer:
    github: taylorfinnell/awscr-signer
    version: ">= 0.9.0"
  # JWT (RS256 via OpenSSL) for the Google service-account -> access-token
  # exchange (VertexAI auth).
  jwt:
    github: crystal-community/jwt
    version: ">= 1.6.0"

development_dependencies:
  ameba:
    github: crystal-ameba/ameba
    version: "~> 1.6"
